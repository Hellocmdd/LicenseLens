name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 双平台各自构建 + 打包平台专属发行物
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and assemble distribution
        run: mvn -B clean verify

      # Linux 发行物：tar.gz + run.sh
      - name: Package distribution (Linux)
        if: matrix.platform == 'linux'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLATFORM="linux"
          STAGE="licenselens-${TAG}-${PLATFORM}"
          rm -rf "$STAGE"
          cp -r distribution/target/dist "$STAGE"
          cat > "$STAGE/run.sh" <<EOF
          #!/usr/bin/env bash
          # LicenseLens ${TAG} — Linux 启动脚本
          SCRIPT_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
          cd "\$SCRIPT_DIR" || exit 1
          java -jar "\$SCRIPT_DIR/licenselens-cli.jar" "\$@"
          EOF
          chmod +x "$STAGE/run.sh"
          cat > "$STAGE/RUN.md" <<EOF
          # LicenseLens ${TAG} (Linux)

          运行环境：JDK 21+

          方式一，直接运行：
            ./run.sh scan --manifest samples/demo-maven/pom.xml

          方式二，手动执行 jar：
            java -jar licenselens-cli.jar scan --manifest samples/demo-maven/pom.xml --plugins plugins

          当前版本可扫描 Maven、npm、Go 与 Python 清单；插件 jar 已随包提供在 plugins/。
          EOF
          tar -czf "licenselens-${TAG}-${PLATFORM}.tar.gz" "$STAGE"
          sha256sum "licenselens-${TAG}-${PLATFORM}.tar.gz" > "licenselens-${TAG}-${PLATFORM}.tar.gz.sha256"

      # Windows 发行物：zip + run.bat
      - name: Package distribution (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $TAG = $env:GITHUB_REF_NAME
          $PLATFORM = "windows"
          $STAGE = "licenselens-$TAG-$PLATFORM"
          if (Test-Path $STAGE) { Remove-Item -Recurse -Force $STAGE }
          Copy-Item -Recurse distribution/target/dist $STAGE
          @"
          @echo off
          rem LicenseLens $TAG — Windows 启动脚本
          cd /d "%~dp0"
          java -jar "%~dp0licenselens-cli.jar" %*
          "@ | Set-Content -Encoding UTF8 "$STAGE/run.bat"
          @"
          # LicenseLens $TAG (Windows)

          运行环境：JDK 21+

          方式一，直接运行：
            run.bat scan --manifest samples\demo-maven\pom.xml

          方式二，手动执行 jar：
            java -jar licenselens-cli.jar scan --manifest samples\demo-maven\pom.xml --plugins plugins

          当前版本可扫描 Maven、npm、Go 与 Python 清单；插件 jar 已随包提供在 plugins 目录。
          "@ | Set-Content -Encoding UTF8 "$STAGE/RUN.md"
          Compress-Archive -Path "$STAGE" -DestinationPath "licenselens-$TAG-$PLATFORM.zip"
          $hash = (Get-FileHash "licenselens-$TAG-$PLATFORM.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  licenselens-$TAG-$PLATFORM.zip" | Set-Content -Encoding ASCII "licenselens-$TAG-$PLATFORM.zip.sha256"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            licenselens-*.tar.gz
            licenselens-*.tar.gz.sha256
            licenselens-*.zip
            licenselens-*.zip.sha256
          if-no-files-found: error

  # 汇总双平台产物，一次性发布到同一个 Release
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f -printf '%f\n' | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/licenselens-*
          generate_release_notes: true
          draft: false
          prerelease: false
