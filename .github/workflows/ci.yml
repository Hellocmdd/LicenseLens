name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and assemble distribution
        run: mvn -B clean verify

      - name: Smoke test assembled CLI
        run: java -jar distribution/target/dist/licenselens-cli.jar scan --manifest samples/demo-npm/package-lock.json --plugins distribution/target/dist/plugins --out report.md
